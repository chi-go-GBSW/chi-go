name: 🐛 버그 리포트
description: 버그를 발견했을 때 작성해주세요
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 어떻게 하면 재현되나요? 단계별로 적어주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: false
  - type: dropdown
    id: part
    attributes:
      label: 관련 파트
      options:
        - mobile
        - backend
        - ai
        - 기타
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경 (OS, 버전 등)
    validations:
      required: false
